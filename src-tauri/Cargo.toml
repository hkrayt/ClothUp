[package]
name = "clothup"
version = "1.1.0"
description = "ClothUp — weather-based outfit suggestions for Jordan"
authors = ["hkrayt"]
license = "MIT"
repository = "https://github.com/hkrayt/ClothUp"
edition = "2024"
rust-version = "1.90"

[lib]
name = "clothup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
